# Render Blueprint: the free web service. The database (Neon) and the bill
# storage (Cloudflare R2) are free services set up separately; paste their
# details into the variables marked "sync: false" when Render asks.
services:
  - type: web
    name: eatalley-management
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn eatalley.wsgi --workers 2 --timeout 60
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: management.eatalley.in,.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://management.eatalley.in,https://*.onrender.com
      - key: DJANGO_DB_CONN_MAX_AGE
        value: "0"
      - key: DATABASE_URL          # Neon connection string (direct, not pooled)
        sync: false
      - key: DJANGO_S3_BUCKET
        value: eatalley-bills
      - key: DJANGO_S3_ENDPOINT_URL  # https://<account id>.r2.cloudflarestorage.com
        sync: false
      - key: DJANGO_S3_ACCESS_KEY_ID
        sync: false
      - key: DJANGO_S3_SECRET_ACCESS_KEY
        sync: false
