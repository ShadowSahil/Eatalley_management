{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login">
  <span class="logo">Eat<span>alley</span></span>
  <div class="card">
    <h2>Team login</h2>
    {% if form.errors %}<p class="errorlist">Wrong username or password.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field"><label for="id_username">Username</label><input id="id_username" name="username" autocomplete="username" autocapitalize="none" autofocus required></div>
      <div class="field"><label for="id_password">Password</label><input id="id_password" name="password" type="password" autocomplete="current-password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary" style="width:100%" type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
